<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Voice Triage Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    #status { color: #555; }
    #transcript { margin-top: 1.5rem; line-height: 1.6; }
    button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Voice Triage Agent</h1>
  <p>A voice interface for triaging support tickets that can be interrupted
    mid-response, not just talked over. Click Start, allow microphone
    access, and describe an issue -- you can interrupt the agent's reply
    at any point.</p>
  <button id="start-button">Start call</button>
  <p>Status: <span id="status">not started</span></p>
  <div id="transcript"></div>
  <script src="client.js"></script>
</body>
</html>
